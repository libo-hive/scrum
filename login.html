<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0D0D">
<title>Login · Serdang Eagles</title>
<link rel="icon" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <a href="index.html" class="auth-brand">
      <img src="images/logo.png" alt="Logo" class="auth-logo">
      <div class="auth-brand-name">SERDANG EAGLES</div>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Sign in to access your dashboard.</p>

      <div id="errorMsg" class="auth-error" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-full" style="margin-top: 10px;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <br>
        <span>Registration is by invitation only.</span>
      </div>
    </div>

    <a href="index.html" class="auth-back">← Back to Home</a>
  </div>

  <!-- Load Supabase dari config dan logic auth -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
