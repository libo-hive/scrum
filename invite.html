<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <title>Join Serdang Eagles</title>
  <link rel="icon" href="images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body class="auth-body">
  <main class="auth-container onboarding-container">
    <a href="index.html" class="auth-brand">
      <img src="images/logo.png" alt="Serdang Eagles" class="auth-logo">
      <div class="auth-brand-name">SERDANG EAGLES</div>
    </a>
    <section class="auth-card onboarding-card">
      <div class="onboarding-kicker"><span class="step-dot"></span> INVITATION REGISTRATION</div>
      <h1 class="auth-title">Join the club</h1>
      <p class="auth-sub" id="inviteIntro">Create your member account. An administrator will review your application before you can continue.</p>
      <div id="inviteMessage" class="onboarding-message" role="status" aria-live="polite" hidden></div>
      <form id="inviteForm" hidden>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" required autocomplete="name" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="phone">Mobile number</label>
          <input type="tel" id="phone" required autocomplete="tel" placeholder="+60 12 345 6789">
        </div>
        <div class="form-group">
          <label for="password">Create password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Enter your password again">
        </div>
        <button type="submit" id="inviteSubmit" class="btn btn-primary btn-full">Send application</button>
      </form>
      <p class="onboarding-footnote">Your invitation is single-use. Access is enabled only after admin approval and your role profile is complete.</p>
    </section>
    <a href="login.html" class="auth-back">Already have an account? Sign in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/invite.js?v=parent-player-registration"></script>
</body>
</html>
