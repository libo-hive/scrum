<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D"><title>Finance · Serdang Eagles</title>
  <link rel="icon" href="images/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/coach.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-pages.css"><link rel="stylesheet" href="css/fab.css"><link rel="stylesheet" href="css/bottom-nav.css">
</head>
<body>
  <header class="app-header"><a href="dashboard.html" class="app-logo-link"><img src="images/logo.png" alt="Serdang Eagles" class="app-logo"></a>
    <div class="app-title"><div class="app-title-main">Club management</div><div class="app-title-sub">Finance</div></div>
    <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out">↗</button>
  </header>
  <main class="app-main admin-page-main">
    <div class="dash-section"><div class="dash-tag">Accounts &amp; payments</div><h1 class="dash-title">Finance</h1></div>
    <p class="page-intro">Create player invoices, track what is outstanding and record payments received.</p>
    <div id="page-message" class="page-message" role="status" aria-live="polite" hidden></div>
    <div id="finance-summary" class="summary-grid-admin"></div>
    <section class="admin-panel">
      <div class="admin-panel-head"><h2 class="admin-section-title">Invoices</h2></div>
      <div class="admin-toolbar"><input id="invoice-search" type="search" placeholder="Search invoice or player"><select id="invoice-filter"><option value="all">All statuses</option><option value="outstanding">Outstanding</option><option value="partially_paid">Partially paid</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select></div>
      <div id="invoice-list" class="admin-list"><div class="admin-empty">Loading invoices…</div></div>
    </section>
    <section class="admin-panel"><div class="admin-panel-head"><h2 class="admin-section-title">Recent payments</h2></div><div id="payment-list" class="admin-list"><div class="admin-empty">Loading payments…</div></div></section>
  </main>
  <nav class="dock app-bottom-nav" id="app-dock" aria-label="Admin navigation" hidden></nav>
  <div class="admin-fab-menu" id="admin-fab-menu" data-fab-menu="finance" hidden></div>
  <dialog id="invoice-dialog" class="admin-dialog"><form id="invoice-form" class="admin-form">
    <div class="admin-panel-head"><h2 class="admin-section-title">New invoice</h2><button type="button" class="sheet-close" data-close-dialog aria-label="Close">×</button></div>
    <div class="admin-form-grid">
      <label class="span-2">Player<select name="player_id" id="invoice-player" required></select></label>
      <label>Description<input name="description" required maxlength="140" placeholder="e.g. Annual membership fee"></label>
      <label>Amount (MYR)<input name="amount" type="number" min="0.01" step="0.01" required></label>
      <label>Issue date<input name="issue_date" type="date" required></label>
      <label>Due date<input name="due_date" type="date"></label>
    </div>
    <div class="admin-form-actions"><button type="button" class="admin-button-secondary" data-close-dialog>Cancel</button><button class="admin-button" type="submit">Create invoice</button></div>
  </form></dialog>
  <dialog id="payment-dialog" class="admin-dialog"><form id="payment-form" class="admin-form">
    <div class="admin-panel-head"><h2 class="admin-section-title">Record payment</h2><button type="button" class="sheet-close" data-close-dialog aria-label="Close">×</button></div>
    <input type="hidden" name="invoice_id">
    <p class="admin-muted" id="payment-balance"></p>
    <div class="admin-form-grid">
      <label>Amount (MYR)<input name="amount" type="number" min="0.01" step="0.01" required></label>
      <label>Method<select name="method" required><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="duitnow_qr">DuitNow QR</option><option value="fpx">FPX</option><option value="card">Card</option><option value="ewallet">E-wallet</option><option value="cheque">Cheque</option></select></label>
      <label class="span-2">Reference (optional)<input name="reference_no" maxlength="120"></label>
    </div>
    <div class="admin-form-actions"><button type="button" class="admin-button-secondary" data-close-dialog>Cancel</button><button class="admin-button" type="submit">Record payment</button></div>
  </form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
  <script src="js/route-guard.js"></script><script src="js/bottom-nav.js"></script><script src="js/admin-tools.js"></script><script src="js/finance-admin.js"></script><script src="js/admin-fab-menu.js"></script>
</body></html>
