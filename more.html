<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D"><title>More · Serdang Eagles</title>
  <link rel="icon" href="images/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/coach.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-pages.css"><link rel="stylesheet" href="css/fab.css"><link rel="stylesheet" href="css/bottom-nav.css">
</head>
<body>
  <header class="app-header"><a href="dashboard.html" class="app-logo-link"><img src="images/logo.png" alt="Serdang Eagles" class="app-logo"></a>
    <div class="app-title"><div class="app-title-main">Club management</div><div class="app-title-sub">More tools</div></div>
    <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out">↗</button>
  </header>
  <main class="app-main admin-page-main">
    <div class="dash-section"><div class="dash-tag">Club tools</div><h1 class="dash-title">More</h1></div>
    <p class="page-intro">Club information, announcements and quick links for administrators.</p>
    <div id="page-message" class="page-message" role="status" aria-live="polite" hidden></div>
    <section class="admin-panel"><div class="admin-panel-head"><h2 class="admin-section-title">Club profile</h2></div><div id="club-settings" class="club-settings-grid"></div></section>
    <section class="admin-panel">
      <div class="admin-panel-head"><h2 class="admin-section-title">Announcements</h2></div>
      <div id="announcement-list" class="admin-list"><div class="admin-empty">Loading announcements…</div></div>
    </section>
    <section class="admin-panel" id="quick-links"><div class="admin-panel-head"><h2 class="admin-section-title">Quick links</h2></div>
      <div class="admin-toolbar"><a class="admin-button-secondary" href="members.html">Members &amp; invitations</a><a class="admin-button-secondary" href="teams.html">Teams &amp; squads</a><a class="admin-button-secondary" href="events.html">Events calendar</a><a class="admin-button-secondary" href="finance.html">Finance</a></div>
    </section>
  </main>
  <nav class="dock app-bottom-nav" id="app-dock" aria-label="Admin navigation" hidden></nav>
  <div class="admin-fab-menu" id="admin-fab-menu" data-fab-menu="more" hidden></div>
  <dialog id="announcement-dialog" class="admin-dialog"><form id="announcement-form" class="admin-form">
    <div class="admin-panel-head"><h2 class="admin-section-title">New announcement</h2><button type="button" class="sheet-close" data-close-dialog aria-label="Close">×</button></div>
    <div class="admin-form-grid">
      <label class="span-2">Title<input name="title" required maxlength="140"></label>
      <label class="span-2">Message<textarea name="body" required maxlength="5000" rows="5"></textarea></label>
      <label class="span-2">Audience<select name="audience"><option value="all">All club members</option><option value="coaches">Coaches</option><option value="players">Players</option></select></label>
      <label class="span-2"><span><input name="pinned" type="checkbox"> Pin this announcement</span></label>
    </div>
    <div class="admin-form-actions"><button type="button" class="admin-button-secondary" data-close-dialog>Cancel</button><button class="admin-button" type="submit">Publish</button></div>
  </form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
  <script src="js/route-guard.js"></script><script src="js/bottom-nav.js"></script><script src="js/admin-tools.js"></script><script src="js/more-admin.js"></script><script src="js/admin-fab-menu.js"></script>
</body></html>
