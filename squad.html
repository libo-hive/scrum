<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <title>Squad · Serdang Eagles</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/coach.css">
  <link rel="stylesheet" href="css/coach-tools.css">
  <link rel="stylesheet" href="css/bottom-nav.css">
</head>
<body>
  <header class="app-header">
    <a href="dashboard.html" class="app-logo-link"><img src="images/logo.png" alt="Serdang Eagles" class="app-logo"></a>
    <div class="app-title"><div class="app-title-main">Coach workspace</div><div class="app-title-sub">Squad</div></div>
    <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out">↗</button>
  </header>
  <main class="app-main coach-tools-main">
    <div class="dash-section">
      <div class="dash-tag">Team performance</div>
      <h1 class="dash-title">Squad</h1>
    </div>
    <div id="page-message" class="coach-message" role="status" aria-live="polite" hidden></div>
    <div id="team-picker-wrap" class="form-group" hidden>
      <label for="team-picker">Team</label><select id="team-picker"></select>
    </div>
    <section id="team-empty" class="coach-empty-state" hidden>
      <h2>No team assigned</h2>
      <p>Your admin needs to create the team and assign you as its coach before player and performance data can appear.</p>
    </section>
    <div id="squad-content" hidden>
      <div id="squad-kpis" class="kpi-grid"></div>
      <section class="dash-section coach-panel">
        <div class="coach-panel-head"><div><div class="dash-tag">Roster</div><h2 class="coach-section-title" id="team-name"></h2></div></div>
        <div class="squad-toolbar">
          <input class="squad-search" id="player-search" type="search" placeholder="Search player or position">
          <div class="squad-filters" id="player-filters">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="active">Active</button>
            <button class="filter-chip" data-filter="injured">Injured</button>
          </div>
        </div>
        <div id="player-list" class="coach-list"></div>
      </section>
      <section class="dash-section coach-panel">
        <div class="dash-tag">Performance</div>
        <h2 class="coach-section-title">Recent fitness results</h2>
        <div id="fitness-list" class="coach-list"></div>
      </section>
    </div>
  </main>
  <nav class="dock app-bottom-nav" id="app-dock" aria-label="Coach navigation" hidden></nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/route-guard.js"></script>
  <script src="js/bottom-nav.js"></script>
  <script src="js/coach-tools.js"></script>
  <script src="js/squad.js"></script>
</body>
</html>
